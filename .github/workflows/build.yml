name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 显示 Flutter 版本
        run: flutter --version

      - name: 获取依赖
        run: flutter pub get

      - name: 验证代码格式
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建 Windows 发布版本
        run: flutter build windows --release

      - name: 复制 assets 文件夹到构建输出目录
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $assetsDir = "$buildDir\assets"
          
          if (-not (Test-Path $buildDir)) {
            Write-Error "构建输出目录不存在: $buildDir"
            exit 1
          }
          
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          Copy-Item -Path "lib\assets\*" -Destination $assetsDir -Recurse -Force
          
          # 验证复制是否成功
          if (Test-Path "$assetsDir\icons") {
            Write-Host "✓ Assets 文件夹已成功复制到 $assetsDir"
            Write-Host "  - Icons 文件夹: $(Get-ChildItem "$assetsDir\icons" | Measure-Object).Count 个文件"
          } else {
            Write-Warning "警告: Icons 文件夹未找到"
          }

      - name: 创建发布包
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $version = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { $_.Line -replace 'version:\s*', '' }).Trim()
          $version = $version -replace '\+.*', '' -replace '\.', '_'
          $archiveName = "env4php_windows_$version.zip"
          
          # 检查构建输出目录
          if (-not (Test-Path $buildDir)) {
            Write-Error "构建输出目录不存在: $buildDir"
            exit 1
          }
          
          # 使用 PowerShell 压缩文件
          Compress-Archive -Path "$buildDir\*" -DestinationPath $archiveName -Force
          
          # 验证压缩包是否创建成功
          if (Test-Path $archiveName) {
            $fileSize = (Get-Item $archiveName).Length / 1MB
            Write-Host "✓ 发布包已创建: $archiveName ($([math]::Round($fileSize, 2)) MB)"
          } else {
            Write-Error "发布包创建失败"
            exit 1
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/x64/runner/Release/**
            *.zip
          retention-days: 30

      - name: 创建 GitHub Release (仅限标签推送)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

